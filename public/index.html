<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNOVA AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 600px; height: 80vh; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .chat-header { padding: 15px; background: #334155; text-align: center; font-weight: bold; font-size: 1.2rem; border-bottom: 1px solid #475569; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
        .user { background: #2563eb; align-self: flex-end; color: white; }
        .bot { background: #334155; align-self: flex-start; color: #e2e8f0; }
        .chat-input { display: flex; padding: 10px; background: #0f172a; gap: 8px; }
        input { flex: 1; padding: 12px; border: 1px solid #334155; background: #1e293b; color: white; border-radius: 6px; outline: none; }
        button { padding: 12px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">UNOVA AI</div>
        <div class="chat-messages" id="messages">
            <div class="message bot">Bonjour ! Je suis UNOVA AI. Comment puis-je vous aider ?</div>
        </div>
        <form class="chat-input" id="chat-form">
            <input type="text" id="user-input" placeholder="Posez votre question..." required autocomplete="off">
            <button type="submit">Envoyer</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const messages = document.getElementById('messages');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';

            const loadingId = addMessage('Réflexion en cours...', 'bot');

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
                const data = await res.json();
                document.getElementById(loadingId).innerText = data.reply || data.error || 'Erreur inconnue';
            } catch (err) {
                document.getElementById(loadingId).innerText = 'Erreur de connexion au serveur.';
            }
        });

        function addMessage(text, sender) {
            const div = document.createElement('div');
            const id = 'msg-' + Date.now();
            div.id = id;
            div.className = `message ${sender}`;
            div.innerText = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
