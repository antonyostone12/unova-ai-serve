<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>UNOVA AI - Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .chat-container { width: 90%; max-width: 600px; height: 80vh; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { padding: 15px; background: #334155; text-align: center; font-weight: bold; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px; border-radius: 8px; max-width: 80%; }
        .user { background: #2563eb; align-self: flex-end; }
        .bot { background: #334155; align-self: flex-start; }
        .chat-input { display: flex; padding: 10px; background: #0f172a; gap: 8px; }
        input { flex: 1; padding: 10px; border-radius: 6px; border: none; }
        button { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">UNOVA AI</div>
        <div class="chat-messages" id="messages">
            <div class="message bot">Bonjour ! Comment puis-je vous aider aujourd'hui ?</div>
        </div>
        <form class="chat-input" id="chat-form">
            <input type="text" id="user-input" placeholder="Posez votre question..." required>
            <button type="submit">Envoyer</button>
        </form>
    </div>
    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const messages = document.getElementById('messages');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            addMessage(text, 'user');
            input.value = '';
            const loading = addMessage('Réflexion...', 'bot');
            const res = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ prompt: text }) });
            const data = await res.json();
            document.getElementById(loading).innerText = data.reply || 'Erreur.';
        });
        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.id = 'msg-' + Date.now();
            div.className = `message ${sender}`;
            div.innerText = text;
            messages.appendChild(div);
            return div.id;
        }
    </script>
</body>
</html>
